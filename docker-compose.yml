# 鲸翼企业版服务端。
#   只在内网用（http）：docker compose up -d，然后打开 http://服务器地址:8730/admin/
#   外网用（https，自动申请免费证书）：把下面 WWE_DOMAIN 改成你的域名、域名解析到这台服务器、
#     放开 80 和 443 端口，再 docker compose --profile https up -d，打开 https://你的域名/admin/
# 第一次启动后用 docker compose logs whalewing-enterprise 看初始化码。数据在 ./data，备份就是复制这个目录。
services:
  whalewing-enterprise:
    image: ghcr.io/gwen-liu/whalewing-enterprise:0.2.1-rc.5.2
    restart: unless-stopped
    ports:
      - "8730:8730"
    volumes:
      - ./data:/data
    environment:
      # 用了下面的 Caddy 时改成 true，才能拿到员工的真实地址和 https。
      WWE_TRUST_PROXY: "false"

  caddy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WWE_DOMAIN: team.example.com
    command: caddy reverse-proxy --from ${WWE_DOMAIN:-team.example.com} --to whalewing-enterprise:8730
    volumes:
      - caddy-data:/data
    depends_on:
      - whalewing-enterprise

volumes:
  caddy-data:
